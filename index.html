    <style>
      :root {

      body {
        background-color: #0d0e12;

      /* Global CRT scanlines — fixed overlay on top of everything */
      body::after {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(0, 0, 0, 0.18) 3px,
          rgba(0, 0, 0, 0.18) 4px
        );
        pointer-events: none;
        z-index: 9998;
      }
      @keyframes glow-pulse {
        0%, 100% { box-shadow: 0 0 10px rgba(0,212,255,0.3), 0 0 20px rgba(0,212,255,0.1); }
        50%       { box-shadow: 0 0 25px rgba(0,212,255,0.6), 0 0 50px rgba(0,212,255,0.2); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50%       { transform: translateY(-12px); }
      }
      @keyframes scan-sweep {
        0%   { transform: translateY(-100%); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translateY(100vh); opacity: 0; }
      }
      @keyframes grid-move {
        0%   { background-position: 0 0; }
        100% { background-position: 50px 50px; }
      }
      @keyframes neon-flicker {
        0%,19%,21%,23%,25%,54%,56%,100% { opacity: 1; }
        20%,24%,55% { opacity: 0.85; }
      }
      .font-orbitron { font-family: 'Orbitron', sans-serif; }
      .neon-cyan { color: #00d4ff; text-shadow: 0 0 10px rgba(0,212,255,0.8), 0 0 30px rgba(0,212,255,0.4); }
      .neon-purple { color: #a855f7; text-shadow: 0 0 10px rgba(168,85,247,0.8), 0 0 30px rgba(168,85,247,0.4); }
      .neon-border-cyan { box-shadow: 0 0 15px rgba(0,212,255,0.2), inset 0 0 15px rgba(0,212,255,0.03); border-color: rgba(0,212,255,0.3) !important; }
      .neon-border-cyan:hover { box-shadow: 0 0 25px rgba(0,212,255,0.4), inset 0 0 25px rgba(0,212,255,0.05); border-color: rgba(0,212,255,0.6) !important; }
      .glow-cyan { animation: glow-pulse 3s ease-in-out infinite; }
      .grid-bg {
        background-image: linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
        background-size: 50px 50px;
        animation: grid-move 10s linear infinite;
      }
      /* Scan sweep beam on sections */
      .scanline-overlay {
        position: relative;
        overflow: hidden;
      }
      .scanline-overlay::before {
        content: '';
        position: absolute;
        left: 0; right: 0;
        height: 120px;
        background: linear-gradient(transparent, rgba(0,212,255,0.04), transparent);
        animation: scan-sweep 10s linear infinite;
        pointer-events: none;
        z-index: 2;
      }
      .clip-corner {
        clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
      }
      .clip-corner-sm {
        clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
      }
      ::-webkit-scrollbar { width: 6px; }
