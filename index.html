    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              orbitron: ['Orbitron', 'sans-serif'],
            },
            colors: {
              primary: '#000000',
              secondary: '#080810',
              accent: {
                cyan: '#00d4ff',
                purple: '#a855f7',
                pink: '#ec4899',
                blue: '#3b82f6',
              }
            },
            animation: {
              'glow-pulse': 'glow-pulse 3s ease-in-out infinite',
              'float': 'float 6s ease-in-out infinite',

            }
          }

    <style>
      :root {
        --cyan: #00d4ff;
        --purple: #a855f7;
        --pink: #ec4899;
      }
      body {
        background-color: #0d0e12;
        color: #ffffff;
      }
      /* Global CRT scanlines — fixed overlay on top of everything */
      body::after {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(0, 0, 0, 0.18) 3px,
          rgba(0, 0, 0, 0.18) 4px
        );
        pointer-events: none;
        z-index: 9998;
      }
      @keyframes glow-pulse {
        0%, 100% { box-shadow: 0 0 10px rgba(0,212,255,0.3), 0 0 20px rgba(0,212,255,0.1); }
        50%       { box-shadow: 0 0 25px rgba(0,212,255,0.6), 0 0 50px rgba(0,212,255,0.2); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50%       { transform: translateY(-12px); }
      }
      @keyframes scan-sweep {
        0%   { transform: translateY(-100%); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translateY(100vh); opacity: 0; }
      }
      @keyframes grid-move {
        0%   { background-position: 0 0; }
        100% { background-position: 50px 50px; }
      }
      @keyframes neon-flicker {
        0%,19%,21%,23%,25%,54%,56%,100% { opacity: 1; }
        20%,24%,55% { opacity: 0.85; }
      }
      .font-orbitron { font-family: 'Orbitron', sans-serif; }
      .neon-cyan { color: #00d4ff; text-shadow: 0 0 10px rgba(0,212,255,0.8), 0 0 30px rgba(0,212,255,0.4); }
      .neon-purple { color: #a855f7; text-shadow: 0 0 10px rgba(168,85,247,0.8), 0 0 30px rgba(168,85,247,0.4); }
      .neon-border-cyan { box-shadow: 0 0 15px rgba(0,212,255,0.2), inset 0 0 15px rgba(0,212,255,0.03); border-color: rgba(0,212,255,0.3) !important; }
      .neon-border-cyan:hover { box-shadow: 0 0 25px rgba(0,212,255,0.4), inset 0 0 25px rgba(0,212,255,0.05); border-color: rgba(0,212,255,0.6) !important; }
      .glow-cyan { animation: glow-pulse 3s ease-in-out infinite; }
      .grid-bg {
        background-image: linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
        background-size: 50px 50px;
        animation: grid-move 10s linear infinite;
      }
      /* Scan sweep beam on sections */
      .scanline-overlay {
        position: relative;
        overflow: hidden;
      }
      .scanline-overlay::before {
        content: '';
        position: absolute;
        left: 0; right: 0;
        height: 120px;
        background: linear-gradient(transparent, rgba(0,212,255,0.04), transparent);
        animation: scan-sweep 10s linear infinite;
        pointer-events: none;
        z-index: 2;
      }
      .clip-corner {
        clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
      }
      .clip-corner-sm {
        clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0d0e12; }
      ::-webkit-scrollbar-thumb { background: linear-gradient(#00d4ff, #a855f7); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: linear-gradient(#00d4ff, #ec4899); }

      /* ── Loading Screen ── */
      @keyframes logo-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(0,212,255,0.5), 0 0 50px rgba(0,212,255,0.2); }
        50%       { transform: scale(1.06); box-shadow: 0 0 35px rgba(0,212,255,0.8), 0 0 80px rgba(0,212,255,0.35); }
      }
      @keyframes dot-blink {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
        40%            { opacity: 1;   transform: scale(1); }
      }
      @keyframes fade-out-overlay {
        from { opacity: 1; }
        to   { opacity: 0; }
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        background: #0d0e12;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        gap: 0;
      }
      #loading-screen.fade-out {
        animation: fade-out-overlay 0.5s ease forwards;
        pointer-events: none;
      }
      #loading-logo {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid rgba(0,212,255,0.5);
        animation: logo-pulse 2s ease-in-out infinite;
      }
      .loading-label {
        margin-top: 28px;
        font-family: 'Orbitron', sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.25em;
        color: rgba(0,212,255,0.7);
        text-transform: uppercase;
      }
      .loading-page {
        margin-top: 8px;
        font-family: 'Orbitron', sans-serif;
        font-size: 22px;
        font-weight: 900;
        color: #ffffff;
        text-shadow: 0 0 12px rgba(0,212,255,0.7), 0 0 30px rgba(0,212,255,0.3);
        letter-spacing: 0.05em;
      }
      .loading-dots {
        display: flex;
        gap: 6px;
        margin-top: 24px;
      }
      .loading-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #00d4ff;
        animation: dot-blink 1.2s ease-in-out infinite;
      }
      .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
      .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    </style>

        var pageNames = {
          '': 'Website',
          'posts': 'Posts',
          'profile': 'Profile',
          'membership': 'Membership',
          'donate': 'Donation',
          'donate/success': 'Donation',
          'store': 'Store',
          'download': 'Download',
          'messages': 'Messages'
        };
        var name = pageNames[hash] !== undefined
          ? pageNames[hash]
          : hash.startsWith('store/') ? 'Store' : 'Website';
        document.getElementById('loading-page-name').textContent = name;
      })();
